version: 2

# Lives in the repo (not in GitHub's Settings UI) so it carries over when this
# template is used for a new project — repo settings don't. See SETUP.md,
# "Security baseline".
#
# Security updates (Dependabot alerts -> PRs) ignore `schedule` and
# `cooldown` and open as soon as an advisory is published. Version updates
# below run monthly and get GitHub's default 3-day cooldown, in the same
# spirit as `minimumReleaseAge` in pnpm-workspace.yaml.
updates:
  - package-ecosystem: 'npm' # also covers pnpm
    # Root only. In a pnpm workspace the root run already updates every
    # workspace package's package.json *and* the single root lockfile. Also
    # listing '/apps/*' produced duplicate PRs that edited package.json
    # without touching the lockfile, which fail `pnpm install
    # --frozen-lockfile` in CI and Vercel (see PRs #8, #17-#20).
    directory: '/'
    schedule:
      interval: 'monthly'
    # Major versions are deliberate upgrades, not bot PRs. Each one so far
    # was wrong to merge blindly: typescript 7 (astro check doesn't support
    # it), graphql 17 (outside Payload's ^16.8.1 peer range; /api/graphql
    # returned 500), and a Payload 4 upgrade needs the codemod and Node 24.
    # Do those by hand, the way the Payload 3.93 / Next 16.4 bump was done.
    # Minor and patch updates are unaffected. If ignore also suppresses a
    # security PR, security-audit.yml still flags the vulnerable package.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # One PR for every available security fix, instead of one per package
      # (they all edit the same lockfile and would conflict).
      security:
        applies-to: security-updates
        patterns: ['*']
      # Packages that must move together: Payload requires every
      # `payload` / `@payloadcms/*` package at the identical version.
      payload:
        applies-to: version-updates
        patterns: ['payload', '@payloadcms/*']
      next:
        applies-to: version-updates
        patterns: ['next', 'eslint-config-next']
      astro:
        applies-to: version-updates
        patterns: ['astro', '@astrojs/*']
      # react and react-dom must be the same version; bumping one alone
      # builds fine and then breaks at runtime (PR #13 did exactly that).
      react:
        applies-to: version-updates
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
