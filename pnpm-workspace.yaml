packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@payloadcms/db-postgres@3.93.0'
  - '@payloadcms/drizzle@3.93.0'
  - '@payloadcms/graphql@3.93.0'
  - '@payloadcms/next@3.93.0'
  - '@payloadcms/richtext-lexical@3.93.0'
  - '@payloadcms/translations@3.93.0'
  - '@payloadcms/ui@3.93.0'
  - payload@3.93.0
  - '@payloadcms/plugin-cloud-storage@3.93.0'
  - '@payloadcms/storage-s3@3.93.0'
  - '@payloadcms/email-resend@3.93.0'
  - '@payloadcms/plugin-seo@3.93.0'
# Security overrides. Each one only applies while a parent pins an affected
# version (the `@<x` selector), so it goes inert on its own once the parent
# upgrades — delete the entry then. Re-check with `pnpm audit --prod`.
overrides:
  # monaco-editor (Payload admin's code editor) pins dompurify at exactly
  # 3.4.8; fixed in 3.4.17 (same minor line). Monaco isn't instantiated unless
  # a schema uses a `code`/`json` field, which this project doesn't.
  'dompurify@<3.4.17': ^3.4.17
  # @tailwindcss/typography pins 6.0.10 exactly; build-time CSS parsing only.
  'postcss-selector-parser@<6.1.5': ^6.1.5
